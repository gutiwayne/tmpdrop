name: Release

# Publishes a release when a tag v<version> is pushed (e.g. git tag v2.5.1 && git push origin v2.5.1):
# the multi-arch image ghcr.io/gutiwayne/tmpdrop:<version> and static binaries on the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Tag matches the version in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION ?= $V$" Makefile || { echo "::error::Makefile VERSION is not $V"; exit 1; }
          grep -q "image: ghcr.io/gutiwayne/tmpdrop:$V$" compose.yaml || { echo "::error::compose.yaml image is not $V"; exit 1; }

  image:
    name: Image (ghcr.io)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gutiwayne/tmpdrop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$V" \
              -o "dist/tmpdrop-$os-$arch$ext" ./cmd/tmpdrop
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "tmpdrop ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "Image: \`ghcr.io/gutiwayne/tmpdrop:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64). Binaries below; verify with \`SHA256SUMS\`."
